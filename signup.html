<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up | RentSpace</title>
  <link rel="icon" type="image/webp" href="images/favicon.webp">
  <link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    /* ─── Reset & Base ─── */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Jost', sans-serif;
      background: #0d0d0d;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      color: #eaeaea;
    }

    /* ─── Header ─── */
    .rentspace-header {
      background: #1a1a1a;
      padding: 16px 0;
      border-bottom: 1px solid #2c2c2c;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .rentspace-header .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .rentspace-header .logo {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -1px;
      text-decoration: none;
    }
    .rentspace-header .logo span { color: #c5a059; }
    .rentspace-header .logo .light { color: #eaeaea; }
    .rentspace-header nav { display: flex; gap: 20px; align-items: center; }
    .rentspace-header nav a {
      color: #a0a0a0;
      text-decoration: none;
      font-weight: 500;
      transition: color 0.2s;
    }
    .rentspace-header nav a:hover { color: #c5a059; }
    .rentspace-header nav a.cta {
      background: #c5a059;
      color: #0d0d0d;
      padding: 8px 20px;
      border-radius: 6px;
      font-weight: 600;
    }
    .rentspace-header nav a.cta:hover { background: #d4b37a; color: #0d0d0d; }

    /* ─── Signup Container ─── */
    .signup-wrapper {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }
    .signup-card {
      max-width: 480px;
      width: 100%;
      padding: 40px 35px;
      background: #1a1a1a;
      border-radius: 16px;
      border: 1px solid #2c2c2c;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
      animation: fadeUp 0.5s ease;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .signup-card .icon {
      text-align: center;
      font-size: 48px;
      color: #c5a059;
      margin-bottom: 8px;
    }
    .signup-card h1 {
      text-align: center;
      font-size: 28px;
      font-weight: 700;
      color: #eaeaea;
      margin-bottom: 4px;
    }
    .signup-card .subtitle {
      text-align: center;
      color: #888;
      font-size: 15px;
      margin-bottom: 28px;
    }
    .signup-card .form-group { margin-bottom: 16px; }
    .signup-card label {
      display: block;
      font-weight: 600;
      margin-bottom: 4px;
      color: #eaeaea;
      font-size: 14px;
    }
    .signup-card label .required { color: #ff6b6b; }
    .signup-card input {
      width: 100%;
      padding: 12px 16px;
      border: 2px solid #2c2c2c;
      border-radius: 8px;
      font-size: 16px;
      background: #0d0d0d;
      color: #eaeaea;
      font-family: 'Jost', sans-serif;
      transition: border-color 0.3s;
    }
    .signup-card input:focus {
      border-color: #c5a059;
      outline: none;
      box-shadow: 0 0 0 3px rgba(197, 160, 89, 0.15);
    }
    .signup-card input::placeholder { color: #555; }
    .signup-card .helper {
      color: #666;
      font-size: 12px;
      margin-top: 4px;
      display: block;
    }
    .signup-card .btn-signup {
      width: 100%;
      padding: 14px;
      background: #c5a059;
      color: #0d0d0d;
      border: none;
      border-radius: 8px;
      font-size: 18px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.3s, transform 0.1s;
      font-family: 'Jost', sans-serif;
      margin-top: 8px;
    }
    .signup-card .btn-signup:hover { background: #d4b37a; }
    .signup-card .btn-signup:active { transform: scale(0.98); }
    .signup-card .btn-signup:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }
    .signup-card .login-link {
      text-align: center;
      margin-top: 20px;
      color: #888;
      font-size: 15px;
    }
    .signup-card .login-link a {
      color: #c5a059;
      font-weight: 600;
      text-decoration: none;
    }
    .signup-card .login-link a:hover { text-decoration: underline; }
    .signup-card .back-home {
      text-align: center;
      margin-top: 12px;
    }
    .signup-card .back-home a {
      color: #666;
      text-decoration: none;
      font-size: 14px;
    }
    .signup-card .back-home a:hover { color: #c5a059; }

    /* ─── Error & Success ─── */
    .error-box {
      display: none;
      background: #2a1a1a;
      border-left: 4px solid #ff6b6b;
      padding: 12px 16px;
      border-radius: 6px;
      margin-bottom: 16px;
      color: #ff6b6b;
      font-size: 14px;
    }
    .success-box {
      display: none;
      background: #1a2a1a;
      border-left: 4px solid #4CAF50;
      padding: 12px 16px;
      border-radius: 6px;
      margin-bottom: 16px;
      color: #4CAF50;
      font-size: 14px;
    }

    /* ─── Footer ─── */
    .rentspace-footer {
      background: #1a1a1a;
      border-top: 1px solid #2c2c2c;
      padding: 16px 0;
      text-align: center;
      color: #555;
      font-size: 13px;
    }

    /* ─── Responsive ─── */
    @media (max-width: 600px) {
      .rentspace-header .container { flex-wrap: wrap; gap: 10px; justify-content: center; }
      .rentspace-header .logo { font-size: 22px; }
      .rentspace-header nav { gap: 12px; flex-wrap: wrap; justify-content: center; }
      .signup-card { padding: 28px 20px; }
    }
  </style>
</head>
<body>

<!-- ===== HEADER ===== -->
<header class="rentspace-header">
  <div class="container">
      <a href="index.html" class="logo" style="color: aliceblue;" >Rent<span>Space</span><sup class="r-sup">®</sup></a>
    <nav>
      <a href="index.html">Home</a>
      <a href="rentals.html">Rentals</a>
      <a href="about.html">About</a>
      <a href="login.html" class="cta">Sign In</a>
    </nav>
  </div>
</header>

<!-- ===== SIGNUP FORM ===== -->
<main class="signup-wrapper">
  <div class="signup-card">
    <div class="icon"><i class="fas fa-user-plus"></i></div>
    <h1>Create Account</h1>
    <p class="subtitle">Start listing properties in minutes</p>

    <div id="errorBox" class="error-box"></div>
    <div id="successBox" class="success-box"></div>

    <form id="signupForm">
      <div class="form-group">
        <label for="name">Full Name <span class="required">*</span></label>
        <input type="text" id="name" required placeholder="e.g., John Mwangi">
      </div>

      <div class="form-group">
        <label for="email">Email Address <span class="required">*</span></label>
        <input type="email" id="email" required placeholder="you@example.com">
      </div>

      <div class="form-group">
        <label for="phone">Phone Number <span class="required">*</span></label>
        <input type="tel" id="phone" required placeholder="e.g., 2547XXXXXXXX">
        <span class="helper">Format: 2547XXXXXXXX (no spaces or +)</span>
      </div>

      <div class="form-group">
        <label for="password">Password <span class="required">*</span></label>
        <input type="password" id="password" required placeholder="Min 6 characters" minlength="6">
        <span class="helper">At least 6 characters</span>
      </div>

      <div class="form-group">
        <label for="passwordConfirm">Confirm Password <span class="required">*</span></label>
        <input type="password" id="passwordConfirm" required placeholder="Confirm your password">
      </div>

      <button type="submit" class="btn-signup" id="signupBtn">
        <i class="fas fa-rocket"></i> Create Account
      </button>
    </form>

    <div class="login-link">
      Already have an account? <a href="login.html">Sign in</a>
    </div>
    <div class="back-home">
      <a href="index.html"><i class="fas fa-arrow-left"></i> Back to Home</a>
    </div>
  </div>
</main>

<!-- ===== FOOTER ===== -->
<footer class="rentspace-footer">
  <p>&copy; 2026 RentSpace Kenya. All rights reserved.</p>
</footer>

<!-- ===== JAVASCRIPT ===== -->
<script>
document.getElementById('signupForm').addEventListener('submit', async (e) => {
  e.preventDefault();

  const name = document.getElementById('name').value.trim();
  const email = document.getElementById('email').value.trim();
  const phone = document.getElementById('phone').value.trim();
  const password = document.getElementById('password').value;
  const passwordConfirm = document.getElementById('passwordConfirm').value;
  const errorBox = document.getElementById('errorBox');
  const successBox = document.getElementById('successBox');
  const signupBtn = document.getElementById('signupBtn');

  // Reset messages
  errorBox.style.display = 'none';
  successBox.style.display = 'none';

  // Validation
  if (!name) { showError('Full name is required.'); return; }
  if (!email) { showError('Email address is required.'); return; }
  if (!phone) { showError('Phone number is required.'); return; }
  if (password.length < 6) { showError('Password must be at least 6 characters.'); return; }
  if (password !== passwordConfirm) { showError('Passwords do not match.'); return; }

  signupBtn.disabled = true;
  signupBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Creating account...';

  try {
    const response = await fetch('https://rentspace-markeplace.onrender.com/api/auth/signup', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name, email, phone, password }),
    });

    const data = await response.json();

    if (!response.ok) {
      showError(data.error || 'Registration failed. Please try again.');
      signupBtn.disabled = false;
      signupBtn.innerHTML = '<i class="fas fa-rocket"></i> Create Account';
      return;
    }

    // ─── Success ──────────────────────────────────────────────
    localStorage.setItem('rentspace_token', data.token);
    localStorage.setItem('rentspace_user', JSON.stringify(data.user));

    successBox.textContent = '🎉 Account created successfully! Redirecting to dashboard...';
    successBox.style.display = 'block';

    setTimeout(() => {
      window.location.href = 'dashboard.html';
    }, 1500);

  } catch (err) {
    showError('Network error. Please check your connection.');
    signupBtn.disabled = false;
    signupBtn.innerHTML = '<i class="fas fa-rocket"></i> Create Account';
  }

  function showError(msg) {
    errorBox.textContent = msg;
    errorBox.style.display = 'block';
  }
});
</script>

</body>
</html>
