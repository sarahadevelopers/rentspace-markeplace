<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | RentSpace</title>
  <link rel="icon" type="image/webp" href="images/favicon.webp">
  <link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    /* ─── Reset & Base ─── */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Jost', sans-serif;
      background: #0d0d0d;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      color: #eaeaea;
    }

    /* ─── Header ─── */
    .rentspace-header {
      background: #1a1a1a;
      padding: 16px 0;
      border-bottom: 1px solid #2c2c2c;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .rentspace-header .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .rentspace-header .logo {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -1px;
      text-decoration: none;
    }
    .rentspace-header .logo span { color: #c5a059; }
    .rentspace-header .logo .light { color: #eaeaea; }
    .rentspace-header nav { display: flex; gap: 20px; align-items: center; }
    .rentspace-header nav a {
      color: #a0a0a0;
      text-decoration: none;
      font-weight: 500;
      transition: color 0.2s;
    }
    .rentspace-header nav a:hover { color: #c5a059; }
    .rentspace-header nav a.cta {
      background: #c5a059;
      color: #0d0d0d;
      padding: 8px 20px;
      border-radius: 6px;
      font-weight: 600;
    }
    .rentspace-header nav a.cta:hover { background: #d4b37a; color: #0d0d0d; }

    /* ─── Login Container ─── */
    .login-wrapper {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }
    .login-card {
      max-width: 420px;
      width: 100%;
      padding: 40px 35px;
      background: #1a1a1a;
      border-radius: 16px;
      border: 1px solid #2c2c2c;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
      animation: fadeUp 0.5s ease;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .login-card .icon {
      text-align: center;
      font-size: 48px;
      color: #c5a059;
      margin-bottom: 8px;
    }
    .login-card h1 {
      text-align: center;
      font-size: 28px;
      font-weight: 700;
      color: #eaeaea;
      margin-bottom: 4px;
    }
    .login-card .subtitle {
      text-align: center;
      color: #888;
      font-size: 15px;
      margin-bottom: 28px;
    }
    .login-card .form-group { margin-bottom: 18px; }
    .login-card label {
      display: block;
      font-weight: 600;
      margin-bottom: 6px;
      color: #eaeaea;
      font-size: 14px;
    }
    .login-card input {
      width: 100%;
      padding: 12px 16px;
      border: 2px solid #2c2c2c;
      border-radius: 8px;
      font-size: 16px;
      background: #0d0d0d;
      color: #eaeaea;
      font-family: 'Jost', sans-serif;
      transition: border-color 0.3s;
    }
    .login-card input:focus {
      border-color: #c5a059;
      outline: none;
      box-shadow: 0 0 0 3px rgba(197, 160, 89, 0.15);
    }
    .login-card input::placeholder { color: #555; }
    .login-card .form-options {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 6px 0 20px;
      font-size: 14px;
    }
    .login-card .form-options a {
      color: #c5a059;
      text-decoration: none;
      font-weight: 500;
    }
    .login-card .form-options a:hover { text-decoration: underline; }
    .login-card .btn-login {
      width: 100%;
      padding: 14px;
      background: #c5a059;
      color: #0d0d0d;
      border: none;
      border-radius: 8px;
      font-size: 18px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.3s, transform 0.1s;
      font-family: 'Jost', sans-serif;
    }
    .login-card .btn-login:hover { background: #d4b37a; }
    .login-card .btn-login:active { transform: scale(0.98); }
    .login-card .btn-login:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }
    .login-card .signup-link {
      text-align: center;
      margin-top: 20px;
      color: #888;
      font-size: 15px;
    }
    .login-card .signup-link a {
      color: #c5a059;
      font-weight: 600;
      text-decoration: none;
    }
    .login-card .signup-link a:hover { text-decoration: underline; }
    .login-card .back-home {
      text-align: center;
      margin-top: 12px;
    }
    .login-card .back-home a {
      color: #666;
      text-decoration: none;
      font-size: 14px;
    }
    .login-card .back-home a:hover { color: #c5a059; }

    /* ─── Error Message ─── */
    .error-box {
      display: none;
      background: #2a1a1a;
      border-left: 4px solid #ff6b6b;
      padding: 12px 16px;
      border-radius: 6px;
      margin-bottom: 16px;
      color: #ff6b6b;
      font-size: 14px;
    }

    /* ─── Footer ─── */
    .rentspace-footer {
      background: #1a1a1a;
      border-top: 1px solid #2c2c2c;
      padding: 16px 0;
      text-align: center;
      color: #555;
      font-size: 13px;
    }

    /* ─── Responsive ─── */
    @media (max-width: 600px) {
      .rentspace-header .container { flex-wrap: wrap; gap: 10px; justify-content: center; }
      .rentspace-header .logo { font-size: 22px; }
      .rentspace-header nav { gap: 12px; flex-wrap: wrap; justify-content: center; }
      .login-card { padding: 28px 20px; }
    }
  </style>
</head>
<body>

<!-- ===== HEADER ===== -->
<header class="rentspace-header">
  <div class="container">
    <a href="index.html" class="logo" style="color: aliceblue;" >Rent<span>Space</span><sup class="r-sup">®</sup></a>
    <nav>
      <a href="index.html">Home</a>
      <a href="rentals.html">Rentals</a>
      <a href="about.html">About</a>
      <a href="signup.html" class="cta">Get Started</a>
    </nav>
  </div>
</header>

<!-- ===== LOGIN FORM ===== -->
<main class="login-wrapper">
  <div class="login-card">
    <div class="icon"><i class="fas fa-key"></i></div>
    <h1>Welcome Back</h1>
    <p class="subtitle">Sign in to manage your listings</p>

    <div id="errorBox" class="error-box"></div>

    <form id="loginForm">
      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" required placeholder="you@example.com">
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" required placeholder="Enter your password">
      </div>

      <div class="form-options">
        <label style="font-weight:400; color:#888; display:flex; align-items:center; gap:6px; cursor:pointer;">
          <input type="checkbox" id="remember"> Remember me
        </label>
        <a href="reset-password.html">Forgot password?</a>
      </div>

      <button type="submit" class="btn-login" id="loginBtn">
        <i class="fas fa-sign-in-alt"></i> Sign In
      </button>
    </form>

    <div class="signup-link">
      Don't have an account? <a href="signup.html">Sign up free</a>
    </div>
    <div class="back-home">
      <a href="index.html"><i class="fas fa-arrow-left"></i> Back to Home</a>
    </div>
  </div>
</main>

<!-- ===== FOOTER ===== -->
<footer class="rentspace-footer">
  <p>&copy; 2026 RentSpace Kenya. All rights reserved.</p>
</footer>

<!-- ===== JAVASCRIPT ===== -->
<script>
document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const errorBox = document.getElementById('errorBox');
  const loginBtn = document.getElementById('loginBtn');

  // Reset error
  errorBox.style.display = 'none';
  loginBtn.disabled = true;
  loginBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Signing in...';

  try {
    const response = await fetch('https://rentspace-markeplace.onrender.com/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password }),
    });

    const data = await response.json();

    if (!response.ok) {
      errorBox.textContent = data.error || 'Invalid email or password. Please try again.';
      errorBox.style.display = 'block';
      loginBtn.disabled = false;
      loginBtn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Sign In';
      return;
    }

    console.log('✅ Login successful, token received:', data.token);

    // ─── Store token ────────────────────────────────────────────
    try {
      localStorage.setItem('rentspace_token', data.token);
      localStorage.setItem('rentspace_user', JSON.stringify(data.user));
      console.log('✅ Token and user stored in localStorage.');
    } catch (storageError) {
      console.error('❌ Failed to store token in localStorage:', storageError);
      errorBox.textContent = 'Could not save login session. Please try again.';
      errorBox.style.display = 'block';
      loginBtn.disabled = false;
      loginBtn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Sign In';
      return;
    }

    // ─── Redirect to dashboard ──────────────────────────────────
    window.location.href = 'dashboard.html';

  } catch (err) {
    console.error('Login fetch error:', err);
    errorBox.textContent = 'Network error. Please check your connection.';
    errorBox.style.display = 'block';
    loginBtn.disabled = false;
    loginBtn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Sign In';
  }
});

// Optional: add a manual test helper (visible in console)
console.log('🔑 Login page ready – use the form above or test with:');
console.log(
  'fetch("https://rentspace-markeplace.onrender.com/api/auth/login", { method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({email:"info@rentspace.co.ke", password:"Admin123!"}) }).then(r=>r.json()).then(d=>console.log(d))'
);
</script>

</body>
</html>
