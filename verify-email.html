<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verify Email | RentSpace</title>
  <link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Jost', sans-serif;
      background: #0d0d0d;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #eaeaea;
    }
    .verify-container {
      max-width: 500px;
      padding: 40px;
      background: #1a1a1a;
      border-radius: 16px;
      border: 1px solid #2c2c2c;
      text-align: center;
    }
    .icon { font-size: 60px; color: #c5a059; margin-bottom: 20px; }
    h1 { font-size: 28px; margin-bottom: 10px; }
    p { color: #888; line-height: 1.6; margin-bottom: 20px; }
    .spinner { display: inline-block; border: 4px solid #2c2c2c; border-top: 4px solid #c5a059; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .success { color: #4CAF50; }
    .error { color: #ff6b6b; }
    .btn { display: inline-block; background: #c5a059; color: #0d0d0d; padding: 12px 30px; border-radius: 8px; text-decoration: none; font-weight: 600; }
    .btn:hover { background: #d4b37a; }
  </style>
</head>
<body>
  <div class="verify-container" id="verifyContainer">
    <div class="icon"><i class="fas fa-envelope"></i></div>
    <h1>Verifying Your Email</h1>
    <p>Please wait while we verify your email address...</p>
    <div class="spinner" id="spinner"></div>
    <div id="result" style="display: none;"></div>
  </div>

  <script>
    (async function() {
      const urlParams = new URLSearchParams(window.location.search);
      const token = urlParams.get('token');
      const spinner = document.getElementById('spinner');
      const resultDiv = document.getElementById('result');

      if (!token) {
        spinner.style.display = 'none';
        resultDiv.style.display = 'block';
        resultDiv.innerHTML = `
          <i class="fas fa-exclamation-triangle" style="font-size: 40px; color: #ff6b6b;"></i>
          <h2 class="error">Missing Verification Token</h2>
          <p>No verification token was provided. Please check the link in your email.</p>
          <a href="login.html" class="btn">Go to Login</a>
        `;
        return;
      }

      try {
        const res = await fetch(`https://rentspace-markeplace.onrender.com/api/auth/verify-email/${token}`);
        const data = await res.json();

        spinner.style.display = 'none';
        resultDiv.style.display = 'block';

        if (data.success) {
          resultDiv.innerHTML = `
            <i class="fas fa-check-circle" style="font-size: 40px; color: #4CAF50;"></i>
            <h2 class="success">Email Verified! 🎉</h2>
            <p>${data.message}</p>
            <a href="login.html" class="btn">Login Now</a>
          `;
        } else {
          resultDiv.innerHTML = `
            <i class="fas fa-times-circle" style="font-size: 40px; color: #ff6b6b;"></i>
            <h2 class="error">Verification Failed</h2>
            <p>${data.error || 'The verification link is invalid or has expired.'}</p>
            <p style="margin-top: 10px;">Please try signing up again or contact support.</p>
            <a href="signup.html" class="btn">Sign Up</a>
          `;
        }
      } catch (err) {
        spinner.style.display = 'none';
        resultDiv.style.display = 'block';
        resultDiv.innerHTML = `
          <i class="fas fa-times-circle" style="font-size: 40px; color: #ff6b6b;"></i>
          <h2 class="error">Network Error</h2>
          <p>Could not verify your email. Please check your internet connection and try again.</p>
          <a href="login.html" class="btn">Go to Login</a>
        `;
      }
    })();
  </script>
</body>
</html>
