<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reset Password | RentSpace</title>
    <link rel="icon" type="image/webp" href="images/favicon.webp" />
    <link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <style>
        /* ─── Reset & Base ─── */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0d0d0d;
            font-family: 'Jost', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            color: #eaeaea;
        }

        /* ─── Header ─── */
        .rentspace-header {
            background: #1a1a1a;
            padding: 16px 0;
            border-bottom: 1px solid #2c2c2c;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .rentspace-header .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .rentspace-header .logo {
            font-size: 28px;
            font-weight: 800;
            letter-spacing: -1px;
            text-decoration: none;
        }
        .rentspace-header .logo span { color: #c5a059; }
        .rentspace-header .logo .light { color: #eaeaea; }
        .rentspace-header nav { display: flex; gap: 20px; align-items: center; }
        .rentspace-header nav a {
            color: #a0a0a0;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.2s;
        }
        .rentspace-header nav a:hover { color: #c5a059; }
        .rentspace-header nav a.cta {
            background: #c5a059;
            color: #0d0d0d;
            padding: 8px 20px;
            border-radius: 6px;
            font-weight: 600;
        }
        .rentspace-header nav a.cta:hover { background: #d4b37a; color: #0d0d0d; }

        /* ─── Reset Container ─── */
        .reset-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }
        .reset-card {
            max-width: 420px;
            width: 100%;
            padding: 40px 35px;
            background: #1a1a1a;
            border-radius: 16px;
            border: 1px solid #2c2c2c;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
            animation: fadeUp 0.5s ease;
        }
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .reset-card .icon {
            text-align: center;
            font-size: 48px;
            color: #c5a059;
            margin-bottom: 8px;
        }
        .reset-card h1 {
            text-align: center;
            font-size: 28px;
            font-weight: 700;
            color: #eaeaea;
            margin-bottom: 4px;
        }
        .reset-card .subtitle {
            text-align: center;
            color: #888;
            font-size: 15px;
            margin-bottom: 28px;
        }
        .reset-card .form-group { margin-bottom: 18px; }
        .reset-card label {
            display: block;
            font-weight: 600;
            margin-bottom: 5px;
            color: #eaeaea;
            font-size: 14px;
        }
        .reset-card label .required { color: #ff6b6b; }
        .reset-card input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #2c2c2c;
            border-radius: 8px;
            font-size: 16px;
            background: #0d0d0d;
            color: #eaeaea;
            font-family: 'Jost', sans-serif;
            transition: border-color 0.3s;
        }
        .reset-card input:focus {
            border-color: #c5a059;
            outline: none;
            box-shadow: 0 0 0 3px rgba(197, 160, 89, 0.15);
        }
        .reset-card input::placeholder { color: #555; }
        .reset-card .btn {
            width: 100%;
            padding: 14px;
            background: #c5a059;
            color: #0d0d0d;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.3s, transform 0.1s;
            font-family: 'Jost', sans-serif;
        }
        .reset-card .btn:hover { background: #d4b37a; }
        .reset-card .btn:active { transform: scale(0.98); }
        .reset-card .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        .reset-card .btn-secondary {
            background: #2a2a2a;
            color: #a0a0a0;
            margin-top: 10px;
        }
        .reset-card .btn-secondary:hover {
            background: #3a3a3a;
        }

        /* ─── Messages ─── */
        .message {
            padding: 12px 16px;
            border-radius: 6px;
            margin-bottom: 16px;
            display: none;
            font-size: 14px;
        }
        .message.success {
            background: #1a2a1a;
            color: #4CAF50;
            border-left: 4px solid #4CAF50;
            display: block;
        }
        .message.error {
            background: #2a1a1a;
            color: #ff6b6b;
            border-left: 4px solid #ff6b6b;
            display: block;
        }

        /* ─── Hidden state ─── */
        .hidden { display: none !important; }

        /* ─── Back link ─── */
        .reset-card .back-link {
            text-align: center;
            margin-top: 16px;
        }
        .reset-card .back-link a {
            color: #666;
            text-decoration: none;
            font-size: 14px;
            transition: color 0.2s;
        }
        .reset-card .back-link a:hover { color: #c5a059; }
        .reset-card .back-link a i { margin-right: 6px; }

        /* ─── Footer ─── */
        .rentspace-footer {
            background: #1a1a1a;
            border-top: 1px solid #2c2c2c;
            padding: 16px 0;
            text-align: center;
            color: #555;
            font-size: 13px;
        }

        /* ─── Responsive ─── */
        @media (max-width: 600px) {
            .rentspace-header .container { flex-wrap: wrap; gap: 10px; justify-content: center; }
            .rentspace-header .logo { font-size: 22px; }
            .rentspace-header nav { gap: 12px; flex-wrap: wrap; justify-content: center; }
            .reset-card { padding: 28px 20px; }
        }
    </style>
</head>
<body>

<!-- ===== HEADER ===== -->
<header class="rentspace-header">
    <div class="container">
        <a href="index.html" class="logo">
            Rent<span class="light">Space</span>
        </a>
        <nav>
            <a href="index.html">Home</a>
            <a href="rentals.html">Rentals</a>
            <a href="about.html">About</a>
            <a href="login.html" class="cta">Sign In</a>
        </nav>
    </div>
</header>

<!-- ===== RESET PASSWORD ===== -->
<main class="reset-wrapper">
    <div class="reset-card" id="resetContainer">
        <div class="icon"><i class="fas fa-lock"></i></div>
        <h1 id="pageTitle">Reset Password</h1>
        <p class="subtitle" id="pageSubtitle">Enter your email to receive a reset link</p>

        <div id="messageBox" class="message"></div>

        <!-- Step 1: Request Reset -->
        <form id="requestForm">
            <div class="form-group">
                <label for="email">Email Address <span class="required">*</span></label>
                <input type="email" id="email" placeholder="you@example.com" required />
            </div>
            <button type="submit" class="btn" id="requestBtn">
                <i class="fas fa-paper-plane"></i> Send Reset Link
            </button>
        </form>

        <!-- Step 2: Set New Password -->
        <form id="resetForm" class="hidden">
            <div class="form-group">
                <label for="newPassword">New Password <span class="required">*</span></label>
                <input type="password" id="newPassword" placeholder="Min 6 characters" required minlength="6" />
            </div>
            <div class="form-group">
                <label for="confirmPassword">Confirm Password <span class="required">*</span></label>
                <input type="password" id="confirmPassword" placeholder="Confirm new password" required />
            </div>
            <button type="submit" class="btn" id="resetBtn">
                <i class="fas fa-check"></i> Reset Password
            </button>
        </form>

        <div class="back-link">
            <a href="login.html"><i class="fas fa-arrow-left"></i> Back to Login</a>
        </div>
    </div>
</main>

<!-- ===== FOOTER ===== -->
<footer class="rentspace-footer">
    <p>&copy; 2026 RentSpace Kenya. All rights reserved.</p>
</footer>

<!-- ===== JAVASCRIPT ===== -->
<script>
    (function() {
        const API_BASE = 'https://rentspace-markeplace.onrender.com';

        // ─── DOM Elements ──────────────────────────────────────────
        const requestForm = document.getElementById('requestForm');
        const resetForm = document.getElementById('resetForm');
        const emailInput = document.getElementById('email');
        const newPassInput = document.getElementById('newPassword');
        const confirmPassInput = document.getElementById('confirmPassword');
        const requestBtn = document.getElementById('requestBtn');
        const resetBtn = document.getElementById('resetBtn');
        const messageBox = document.getElementById('messageBox');
        const pageTitle = document.getElementById('pageTitle');
        const pageSubtitle = document.getElementById('pageSubtitle');

        // ─── Helpers ──────────────────────────────────────────────
        function showMessage(text, type = 'success') {
            messageBox.textContent = text;
            messageBox.className = 'message ' + type;
        }

        function hideMessage() {
            messageBox.className = 'message';
            messageBox.textContent = '';
        }

        function setLoading(btn, loading) {
            if (loading) {
                btn.disabled = true;
                btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Processing...';
            } else {
                btn.disabled = false;
                btn.innerHTML = btn === requestBtn
                    ? '<i class="fas fa-paper-plane"></i> Send Reset Link'
                    : '<i class="fas fa-check"></i> Reset Password';
            }
        }

        // ─── Check for token in URL ────────────────────────────────
        function getTokenFromUrl() {
            const params = new URLSearchParams(window.location.search);
            return params.get('token');
        }

        const token = getTokenFromUrl();

        if (token) {
            // Switch to reset form
            requestForm.classList.add('hidden');
            resetForm.classList.remove('hidden');
            pageTitle.textContent = 'Set New Password';
            pageSubtitle.textContent = 'Enter your new password below.';

            // Verify token validity (optional)
            fetch(`${API_BASE}/api/auth/verify-reset-token/${token}`)
                .then(res => res.json())
                .then(data => {
                    if (!data.valid) {
                        showMessage('Invalid or expired reset token. Please request a new link.', 'error');
                        resetForm.classList.add('hidden');
                        requestForm.classList.remove('hidden');
                        pageTitle.textContent = 'Reset Password';
                        pageSubtitle.textContent = 'Enter your email to receive a reset link';
                    }
                })
                .catch(() => {
                    showMessage('Could not verify token. Please try again.', 'error');
                });
        } else {
            // Show request form
            requestForm.classList.remove('hidden');
            resetForm.classList.add('hidden');
        }

        // ─── Request Reset ──────────────────────────────────────────
        requestForm.addEventListener('submit', async function(e) {
            e.preventDefault();
            const email = emailInput.value.trim();

            if (!email) {
                showMessage('Please enter your email address.', 'error');
                return;
            }

            setLoading(requestBtn, true);
            hideMessage();

            try {
                const res = await fetch(`${API_BASE}/api/auth/forgot-password`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });
                const data = await res.json();

                if (res.ok) {
                    showMessage(
                        data.message || '✅ If that email is registered, you will receive a reset link.',
                        'success'
                    );
                    emailInput.value = '';
                } else {
                    showMessage(data.error || 'Something went wrong. Please try again.', 'error');
                }
            } catch (err) {
                showMessage('Network error. Please try again later.', 'error');
                console.error(err);
            } finally {
                setLoading(requestBtn, false);
            }
        });

        // ─── Reset Password ─────────────────────────────────────────
        resetForm.addEventListener('submit', async function(e) {
            e.preventDefault();
            const newPassword = newPassInput.value.trim();
            const confirmPassword = confirmPassInput.value.trim();

            if (!newPassword || newPassword.length < 6) {
                showMessage('Password must be at least 6 characters.', 'error');
                return;
            }
            if (newPassword !== confirmPassword) {
                showMessage('Passwords do not match.', 'error');
                return;
            }

            setLoading(resetBtn, true);
            hideMessage();

            try {
                const res = await fetch(`${API_BASE}/api/auth/reset-password`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token, newPassword })
                });
                const data = await res.json();

                if (res.ok) {
                    showMessage('✅ Password reset successfully! Redirecting to login...', 'success');
                    setTimeout(() => {
                        window.location.href = 'login.html';
                    }, 2500);
                } else {
                    showMessage(data.error || 'Failed to reset password. Please try again.', 'error');
                }
            } catch (err) {
                showMessage('Network error. Please try again later.', 'error');
                console.error(err);
            } finally {
                setLoading(resetBtn, false);
            }
        });
    })();
</script>

</body>
</html>
